<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockOS — Controle de Estoque Inteligente</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            accent: {
              DEFAULT: '#2196F3',
              hover: '#1E88E5',
              light: '#64B5F6',
            },
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --bg-image-opacity: 0.45;
      --glass-main: rgba(42, 44, 48, 0.72);
      --glass-card: rgba(62, 65, 71, 0.56);
      --glass-card-hover: rgba(74, 78, 86, 0.68);
      --glass-pill: rgba(45, 47, 52, 0.78);
      --glass-border: rgba(255, 255, 255, 0.11);
      --glass-border-strong: rgba(255, 255, 255, 0.18);
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
    }

    body.high-contrast {
      --bg-image-opacity: 0.2;
      --glass-main: rgba(20, 22, 26, 0.90);
      --glass-card: rgba(34, 37, 43, 0.88);
      --glass-card-hover: rgba(44, 48, 56, 0.95);
      --glass-pill: rgba(22, 24, 29, 0.94);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #16171a;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Fundo arquitetônico escuro sutil similar à imagem de referência */
    .spatial-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 20% 20%, rgba(33, 150, 243, 0.14), transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(255, 255, 255, 0.05), transparent 50%),
        linear-gradient(135deg, #121316 0%, #1d1f24 50%, #141518 100%);
    }

    .spatial-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: var(--bg-image-opacity);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Glassmorphism containers */
    .glass-window {
      background: var(--glass-main);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      border: 1px solid var(--glass-border-strong);
      box-shadow: 0 28px 70px -15px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .glass-card {
      background: var(--glass-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .glass-card-interactive:hover {
      background: var(--glass-card-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .glass-pill {
      background: var(--glass-pill);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--glass-border-strong);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F8FAFC;
      transition: all 0.2s ease;
    }

    .glass-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.11);
      border-color: #2196F3;
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.22);
    }

    .glass-input option {
      background-color: #23252a;
      color: #F8FAFC;
    }

    /* Botão lateral estilo pílula circular */
    .nav-orb {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.72);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-orb:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      transform: scale(1.06);
    }

    .nav-orb.active {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    /* Tooltip flutuante à direita da barra lateral */
    .nav-tooltip {
      position: absolute;
      left: 62px;
      white-space: nowrap;
      background: rgba(24, 26, 31, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-6px);
      transition: all 0.18s ease;
      z-index: 60;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
    }

    .nav-orb:hover .nav-tooltip {
      opacity: 1;
      transform: translateX(0);
    }

    /* Scrollbar discreta */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Animação suave de entrada das abas */
    .fade-slide {
      animation: fadeSlideIn 0.26s ease-out forwards;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: #1a1c20 !important;
      }
    }
  </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">
  <div class="spatial-bg"></div>

  <!-- Toast / Notificação Flutuante -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Layout Principal Spatial UI -->
  <div class="max-w-[1440px] mx-auto px-3 sm:px-6 py-4 sm:py-6 flex flex-col lg:flex-row items-center lg:items-center justify-center gap-4 lg:gap-5 min-h-screen">

    <!-- 1. BARRA LATERAL ESQUERDA FLUTUANTE (ESTILO PÍLULA VERTICAL) -->
    <aside aria-label="Navegação Principal" class="no-print glass-pill rounded-full px-3 py-2.5 lg:px-2.5 lg:py-4 flex flex-row lg:flex-col items-center gap-2 sm:gap-3 z-40 shrink-0">
      <!-- 1. Visão Geral / Dashboard -->
      <button onclick="switchTab('overview')" id="nav-overview" class="nav-orb active" aria-label="Visão Geral">
        <i class="ph ph-squares-four text-2xl"></i>
        <span class="nav-tooltip hidden lg:block">Visão Geral (Dashboard)</span>
      </button>

      <!-- 2. Cadastro de SKU -->
      <button onclick="switchTab('skus')" id="nav-skus" class="nav-orb" aria-label="Cadastro de SKU">
        <i class="ph ph-package text-2xl"></i>
        <span class="nav-tooltip hidden lg:block">Cadastro de SKU (Produtos)</span>
      </button>

      <!-- 3. Gestão de Entradas e Saídas -->
      <button onclick="switchTab('movements')" id="nav-movements" class="nav-orb" aria-label="Entradas e Saídas">
        <i class="ph ph-arrows-left-right text-2xl"></i>
        <span class="nav-tooltip hidden lg:block">Entradas e Saídas</span>
      </button>

      <!-- 4. Controle de Lotes e Validades (FIFO) -->
      <button onclick="switchTab('batches')" id="nav-batches" class="nav-orb" aria-label="Lotes e Validades">
        <i class="ph ph-calendar-check text-2xl"></i>
        <span class="nav-tooltip hidden lg:block">Lotes e Validades (FIFO)</span>
      </button>

      <!-- 5. Alertas de Estoque (Mínimo e Máximo) com Badge Dinâmico -->
      <button onclick="switchTab('alerts')" id="nav-alerts" class="nav-orb" aria-label="Alertas de Estoque">
        <i class="ph ph-warning-circle text-2xl"></i>
        <span id="sidebar-alert-badge" class="absolute -top-0.5 -right-0.5 min-w-[20px] h-[20px] px-1 rounded-full bg-white text-slate-900 text-[11px] font-bold flex items-center justify-center shadow-md">
          0
        </span>
        <span class="nav-tooltip hidden lg:block">Alertas Mínimo / Máximo</span>
      </button>

      <div class="hidden lg:block w-7 h-[1px] bg-white/15 my-0.5"></div>

      <!-- 6. Relatórios e Indicadores (KPIs) -->
      <button onclick="switchTab('reports')" id="nav-reports" class="nav-orb" aria-label="Relatórios e KPIs">
        <i class="ph ph-chart-line-up text-2xl"></i>
        <span class="nav-tooltip hidden lg:block">Relatórios e KPIs</span>
      </button>
    </aside>

    <!-- 2. JANELA PRINCIPAL DO DASHBOARD -->
    <main class="glass-window rounded-[32px] w-full flex-1 p-4 sm:p-6 lg:p-7 flex flex-col gap-5 relative overflow-hidden">

      <!-- BARRA SUPERIOR DO PAINEL PRINCIPAL -->
      <header class="flex flex-wrap items-center justify-between gap-3 sm:gap-4">
        <!-- Esquerda: Título Dinâmico + Seletor de Depósito -->
        <div class="flex items-center gap-3 flex-wrap">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-[#2196F3]/20 border border-[#2196F3]/40 flex items-center justify-center text-[#64B5F6]">
              <i class="ph-fill ph-cube text-xl"></i>
            </div>
            <div>
              <h1 id="header-title" class="text-xl sm:text-2xl font-bold tracking-tight text-white leading-tight">
                Estoque
              </h1>
              <p id="header-subtitle" class="text-[11px] text-slate-400 hidden sm:block">
                Visão Geral e Operações
              </p>
            </div>
          </div>

          <!-- Seletor de Depósito / Filial (estilo dropdown 'Pages' da referência) -->
          <div class="relative">
            <select id="warehouse-select" onchange="changeWarehouse(this.value)" aria-label="Selecionar Depósito"
              class="appearance-none bg-white/10 hover:bg-white/15 border border-white/15 text-white text-xs sm:text-sm font-medium rounded-full pl-3.5 pr-8 py-2 cursor-pointer transition focus:outline-none focus:border-[#2196F3]">
              <option value="Todos">Todos os Depósitos</option>
              <option value="Depósito Principal" selected>Depósito Principal</option>
              <option value="CD São Paulo">CD São Paulo</option>
              <option value="Filial Sul">Filial Sul</option>
            </select>
            <i class="ph ph-caret-up-down text-xs text-slate-300 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>
        </div>

        <!-- Centro: Barra de Busca Global em Formato Pílula -->
        <div class="order-3 md:order-2 w-full md:w-auto md:flex-1 max-w-md">
          <div class="relative">
            <i class="ph ph-magnifying-glass text-slate-300 text-base absolute left-4 top-1/2 -translate-y-1/2"></i>
            <input id="global-search" type="text" oninput="handleGlobalSearch(this.value)"
              placeholder="Buscar SKU, produto, lote ou movimentação..."
              class="w-full bg-white/10 hover:bg-white/[0.13] focus:bg-white/15 border border-white/12 focus:border-[#2196F3] rounded-full pl-10 pr-9 py-2 text-xs sm:text-sm text-white placeholder-slate-400 transition focus:outline-none" />
            <button id="clear-search-btn" onclick="clearGlobalSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
              <i class="ph ph-x-circle text-base"></i>
            </button>
          </div>
        </div>

        <!-- Direita: Botão '+ Novo Registro', Contraste e Sino de Notificações -->
        <div class="order-2 md:order-3 flex items-center gap-2 sm:gap-2.5">
          <button onclick="openContextualModal()"
            class="bg-[#2196F3] hover:bg-[#1E88E5] active:scale-[0.98] text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-full shadow-lg shadow-blue-500/25 flex items-center gap-1.5 transition cursor-pointer">
            <i class="ph-bold ph-plus text-sm"></i>
            <span id="primary-action-label">Novo Registro</span>
          </button>

          <!-- Botão Alternar Contraste -->
          <button onclick="toggleContrast()" title="Alternar Contraste do Vidro"
            class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 border border-white/12 flex items-center justify-center text-slate-200 transition cursor-pointer">
            <i class="ph ph-sun-dim text-lg"></i>
          </button>

          <!-- Sino de Notificações Interativo -->
          <div class="relative">
            <button onclick="toggleNotificationsPopover()" title="Notificações do Estoque"
              class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 border border-white/12 flex items-center justify-center text-slate-200 transition cursor-pointer relative">
              <i class="ph ph-bell text-lg"></i>
              <span id="bell-dot" class="w-2.5 h-2.5 rounded-full bg-rose-500 border-2 border-[#2a2c30] absolute top-1 right-1.5"></span>
            </button>

            <!-- Popover de Notificações -->
            <div id="notifications-popover" class="hidden absolute right-0 mt-2 w-80 sm:w-96 glass-pill rounded-2xl p-4 z-50 shadow-2xl">
              <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-white/10">
                <span class="text-sm font-semibold text-white">Alertas e Avisos Recentes</span>
                <button onclick="switchTab('alerts'); toggleNotificationsPopover();" class="text-xs text-[#64B5F6] hover:underline">
                  Ver todos
                </button>
              </div>
              <div id="notifications-list" class="flex flex-col gap-2 max-h-64 overflow-y-auto pr-1"></div>
            </div>
          </div>

          <!-- Avatar Rápido Mobile/Desktop -->
          <div onclick="switchTab('reports')" title="Perfil do Gestor"
            class="w-9 h-9 rounded-full bg-gradient-to-tr from-[#2196F3] to-cyan-400 p-[2px] cursor-pointer hidden sm:block">
            <div class="w-full h-full rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold text-white">
              RM
            </div>
          </div>
        </div>
      </header>

      <!-- ÁREA DINÂMICA DO CONTEÚDO CENTRAL -->
      <section id="dynamic-content" class="fade-slide">
        <!-- Renderizado dinamicamente via JavaScript -->
      </section>
    </main>
  </div>

  <!-- MODAL UNIVERSAL (NOVO / EDITAR SKU, NOVA ENTRADA/SAÍDA, NOVO LOTE) -->
  <div id="universal-modal" class="hidden fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass-pill rounded-[28px] w-full max-w-xl p-6 relative animate-[fadeSlideIn_0.2s_ease-out] max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-4 mb-4 border-b border-white/10">
        <div class="flex items-center gap-2.5">
          <div id="modal-icon-box" class="w-9 h-9 rounded-xl bg-[#2196F3]/20 text-[#64B5F6] flex items-center justify-center">
            <i class="ph ph-plus-circle text-xl"></i>
          </div>
          <div>
            <h2 id="modal-title" class="text-lg font-bold text-white">Novo Registro</h2>
            <p id="modal-subtitle" class="text-xs text-slate-400">Preencha os dados abaixo</p>
          </div>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-slate-300 hover:text-white transition">
          <i class="ph ph-x text-base"></i>
        </button>
      </div>

      <!-- Seletor rápido de tipo de ação dentro do modal -->
      <div id="modal-type-switcher" class="grid grid-cols-3 gap-2 p-1 rounded-2xl bg-black/25 border border-white/10 mb-5">
        <button type="button" onclick="setModalMode('movement')" id="mode-btn-movement"
          class="py-2 px-3 rounded-xl text-xs font-semibold transition bg-[#2196F3] text-white">
          Entrada / Saída
        </button>
        <button type="button" onclick="setModalMode('sku')" id="mode-btn-sku"
          class="py-2 px-3 rounded-xl text-xs font-semibold transition text-slate-300 hover:text-white">
          Cadastrar SKU
        </button>
        <button type="button" onclick="setModalMode('batch')" id="mode-btn-batch"
          class="py-2 px-3 rounded-xl text-xs font-semibold transition text-slate-300 hover:text-white">
          Novo Lote FIFO
        </button>
      </div>

      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ESTADO GLOBAL E DADOS REALISTAS DE DEMONSTRAÇÃO (DATA BASE: NOV/2026)
    // =========================================================================
    const REFERENCE_TODAY = new Date('2026-11-12T10:00:00');

    let state = {
      activeTab: 'overview',
      selectedWarehouse: 'Depósito Principal',
      searchQuery: '',
      chartPeriod: '12-18 Nov',
      editingSkuId: null,
      modalMode: 'movement',

      // Catálogo de SKUs (Inicia vazio para novos cadastros)
      skus: [],

      // Controle de Lotes e Validades (FIFO - Inicia vazio)
      batches: [],

      // Histórico de Entradas e Saídas (Inicia vazio)
      movements: [],

      // Dados semanais para o gráfico estilizado (Zerados inicialmente)
      weeklyChart: {
        '12-18 Nov': [
          { day: 'S', entries: 0, exits: 0, reserve: 0 },
          { day: 'T', entries: 0, exits: 0, reserve: 0 },
          { day: 'Q', entries: 0, exits: 0, reserve: 0 },
          { day: 'Q', entries: 0, exits: 0, reserve: 0 },
          { day: 'S', entries: 0, exits: 0, reserve: 0 },
          { day: 'S', entries: 0, exits: 0, reserve: 0 },
          { day: 'D', entries: 0, exits: 0, reserve: 0 }
        ],
        '05-11 Nov': [
          { day: 'S', entries: 0, exits: 0, reserve: 0 },
          { day: 'T', entries: 0, exits: 0, reserve: 0 },
          { day: 'Q', entries: 0, exits: 0, reserve: 0 },
          { day: 'Q', entries: 0, exits: 0, reserve: 0 },
          { day: 'S', entries: 0, exits: 0, reserve: 0 },
          { day: 'S', entries: 0, exits: 0, reserve: 0 },
          { day: 'D', entries: 0, exits: 0, reserve: 0 }
        ]
      }
    };

    // =========================================================================
    // FUNÇÕES UTILITÁRIAS E CÁLCULOS AUTOMÁTICOS
    // =========================================================================
    function formatCurrency(val) {
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function getFilteredSkus() {
      return state.skus.filter(sku => {
        const matchWarehouse = state.selectedWarehouse === 'Todos' || sku.warehouse === state.selectedWarehouse;
        const q = state.searchQuery.trim().toLowerCase();
        const matchQuery = !q ||
          sku.code.toLowerCase().includes(q) ||
          sku.name.toLowerCase().includes(q) ||
          sku.category.toLowerCase().includes(q) ||
          sku.supplier.toLowerCase().includes(q);
        return matchWarehouse && matchQuery;
      });
    }

    function getStockAlerts() {
      const alerts = [];
      state.skus.forEach(sku => {
        if (state.selectedWarehouse !== 'Todos' && sku.warehouse !== state.selectedWarehouse) return;
        if (sku.stock < sku.minStock) {
          alerts.push({
            type: 'min',
            severity: sku.stock === 0 ? 'Crítico' : 'Abaixo do Mínimo',
            sku,
            diff: sku.minStock - sku.stock,
            suggestedOrder: Math.max(sku.maxStock - sku.stock, sku.minStock * 2 - sku.stock)
          });
        } else if (sku.stock > sku.maxStock) {
          alerts.push({
            type: 'max',
            severity: 'Excesso de Estoque',
            sku,
            diff: sku.stock - sku.maxStock,
            excessCapital: (sku.stock - sku.maxStock) * sku.costPrice
          });
        }
      });
      return alerts;
    }

    function getDaysToExpiry(expDateStr) {
      const exp = new Date(expDateStr + 'T10:00:00');
      const diffMs = exp - REFERENCE_TODAY;
      return Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    }

    function getBatchStatus(days) {
      if (days < 0) {
        return { label: `Vencido há ${Math.abs(days)}d`, badge: 'bg-rose-500/20 text-rose-300 border-rose-500/40', code: 'expired' };
      }
      if (days <= 30) {
        return { label: `Vence em ${days}d`, badge: 'bg-amber-500/20 text-amber-300 border-amber-500/40', code: 'warning' };
      }
      return { label: `Válido (${days}d)`, badge: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40', code: 'valid' };
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'border-emerald-400/40 bg-slate-900/90 text-emerald-200',
        warning: 'border-amber-400/40 bg-slate-900/90 text-amber-200',
        info: 'border-blue-400/40 bg-slate-900/90 text-blue-200'
      };
      const icon = type === 'success' ? 'ph-check-circle' : type === 'warning' ? 'ph-warning' : 'ph-info';
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl text-xs sm:text-sm font-medium transition-all duration-300 ${colors[type] || colors.info}`;
      toast.innerHTML = `<i class="ph-fill ${icon} text-lg"></i><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3400);
    }

    // =========================================================================
    // NAVEGAÇÃO E CONTROLE DE INTERFACE
    // =========================================================================
    const TAB_META = {
      overview: {
        title: 'Estoque',
        subtitle: 'Visão Geral e Operações em Tempo Real',
        actionLabel: 'Novo Registro',
        modalMode: 'movement'
      },
      skus: {

    function switchTab(tabKey) {
      state.activeTab = tabKey;

      // Atualiza estado visual dos ícones na pílula lateral
      document.querySelectorAll('.nav-orb').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`nav-${tabKey}`);
      if (activeBtn) activeBtn.classList.add('active');

      // Atualiza cabeçalho
      const meta = TAB_META[tabKey];
      document.getElementById('header-title').textContent = meta.title;
      document.getElementById('header-subtitle').textContent = meta.subtitle;
      document.getElementById('primary-action-label').textContent = meta.actionLabel;

      renderCurrentTab();
    }

    function changeWarehouse(warehouse) {
      state.selectedWarehouse = warehouse;
      updateBadgesAndNotifications();
      renderCurrentTab();
    }

    function handleGlobalSearch(val) {
      state.searchQuery = val;
      const clearBtn = document.getElementById('clear-search-btn');
      clearBtn.classList.toggle('hidden', !val);
      renderCurrentTab();
    }

    function clearGlobalSearch() {
      state.searchQuery = '';
      document.getElementById('global-search').value = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      renderCurrentTab();
    }

    function toggleContrast() {
      document.body.classList.toggle('high-contrast');
      const isHC = document.body.classList.contains('high-contrast');
      showToast(isHC ? 'Modo Alto Contraste ativado' : 'Modo Glassmorphism padrão ativado', 'info');
    }

    function toggleNotificationsPopover() {
      const pop = document.getElementById('notifications-popover');
      pop.classList.toggle('hidden');
    }

    function updateBadgesAndNotifications() {
      const alerts = getStockAlerts();
      const expiringBatches = state.batches.filter(b => getDaysToExpiry(b.expDate) <= 30);
      const totalAlerts = alerts.length;

      const badge = document.getElementById('sidebar-alert-badge');
      badge.textContent = totalAlerts;
      badge.classList.toggle('hidden', totalAlerts === 0);

      const bellDot = document.getElementById('bell-dot');
      bellDot.classList.toggle('hidden', totalAlerts === 0 && expiringBatches.length === 0);

      const notifList = document.getElementById('notifications-list');
      let html = '';

      alerts.forEach(a => {
        const isMin = a.type === 'min';
        html += `
          <div onclick="switchTab('alerts'); toggleNotificationsPopover();" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 cursor-pointer transition flex items-start gap-2.5">
            <i class="ph-fill ${isMin ? 'ph-arrow-circle-down text-rose-400' : 'ph-arrow-circle-up text-amber-400'} text-lg mt-0.5"></i>
            <div class="text-xs">
              <p class="font-semibold text-white">${a.sku.name}</p>
              <p class="text-slate-300 mt-0.5">
                ${isMin ? `Saldo atual (${a.sku.stock} ${a.sku.unit}) abaixo do mínimo (${a.sku.minStock}).` : `Saldo (${a.sku.stock} ${a.sku.unit}) acima do máximo (${a.sku.maxStock}).`}
              </p>
            </div>
          </div>
        `;
      });

      expiringBatches.forEach(b => {
        const days = getDaysToExpiry(b.expDate);
        html += `
          <div onclick="switchTab('batches'); toggleNotificationsPopover();" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 cursor-pointer transition flex items-start gap-2.5">
            <i class="ph-fill ph-clock-countdown text-amber-400 text-lg mt-0.5"></i>
            <div class="text-xs">
              <p class="font-semibold text-white">Lote ${b.batchNumber} (${b.skuCode})</p>
              <p class="text-slate-300 mt-0.5">${days < 0 ? `Vencido há ${Math.abs(days)} dias!` : `Vence em ${days} dias (FIFO prioritário).`}</p>
            </div>
          </div>
        `;
      });

      notifList.innerHTML = html || `<p class="text-xs text-slate-400 py-4 text-center">Nenhum alerta pendente no momento.</p>`;
    }

    // RENDERIZAÇÃO DAS 6 TELAS DO DASHBOARD

    function renderCurrentTab() {
      updateBadgesAndNotifications();
      const container = document.getElementById('dynamic-content');
      container.classList.remove('fade-slide');
      void container.offsetWidth; // força reflow da animação
      container.classList.add('fade-slide');

      switch (state.activeTab) {
        case 'overview':
          container.innerHTML = renderOverviewTab();
          break;
        case 'skus':
          container.innerHTML = renderSkusTab();
          break;
        case 'movements':
          container.innerHTML = renderMovementsTab();
          break;
        case 'batches':
          container.innerHTML = renderBatchesTab();
          break;
        case 'alerts':
          container.innerHTML = renderAlertsTab();
          break;
        case 'reports':
          container.innerHTML = renderReportsTab();
          break;
      }
    }

              <div class="flex flex-col gap-3">

                    <div>
                      <div class="flex justify-between text-[11px] mb-1">

    // -------------------------------------------------------------------------
    // 3. GESTÃO DE ENTRADAS E SAÍDAS
    // -------------------------------------------------------------------------
    function renderMovementsTab() {
      const q = state.searchQuery.trim().toLowerCase();
      const filteredMovs = state.movements.filter(m => {
        const matchW = state.selectedWarehouse === 'Todos' || m.warehouse === state.selectedWarehouse;
        const matchQ = !q || m.skuCode.toLowerCase().includes(q) || m.skuName.toLowerCase().includes(q) || m.reason.toLowerCase().includes(q);

      });

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <!-- Formulário Rápido Lateral (4 cols) -->
          <div class="lg:col-span-4 glass-card rounded-[24px] p-5 h-fit">
            <h2 class="text-base font-semibold text-white mb-1">Registrar Movimentação</h2>
            <p class="text-xs text-slate-400 mb-4">Atualiza o saldo do SKU automaticamente</p>

            <form onsubmit="submitInlineMovement(event)" class="flex flex-col gap-3.5">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Tipo de Operação</label>
                <select id="inline-mov-type" required class="glass-input w-full rounded-xl px-3.5 py-2.5 text-xs sm:text-sm">
                  <option value="Entrada">Entrada (Compra / Devolução)</option>
                  <option value="Saída">Saída (Venda / Expedição)</option>
                  <option value="Ajuste">Ajuste / Perda de Inventário (-)</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Produto (SKU)</label>
                <select id="inline-mov-sku" required class="glass-input w-full rounded-xl px-3.5 py-2.5 text-xs sm:text-sm">
                  ${state.skus.map(s => `<option value="${s.code}">${s.code} — ${s.name} (Saldo: ${s.stock} ${s.unit})</option>`).join('')}
                </select>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Quantidade</label>
                  <input id="inline-mov-qty" type="number" min="1" value="5" required class="glass-input w-full rounded-xl px-3.5 py-2.5 text-xs sm:text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-1">Documento / NF</label>
                  <input id="inline-mov-reason" type="text" placeholder="Ex: NF 5012" required class="glass-input w-full rounded-xl px-3.5 py-2.5 text-xs sm:text-sm" />
                </div>
              </div>

              <button type="submit" class="mt-2 w-full bg-[#2196F3] hover:bg-[#1E88E5] text-white font-semibold text-xs sm:text-sm py-3 rounded-xl shadow-lg shadow-blue-500/25 transition cursor-pointer">
                Confirmar Movimentação
              </button>
            </form>
          </div>

          <!-- Histórico Completo (8 cols) -->
          <div class="lg:col-span-8 glass-card rounded-[24px] p-5">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h2 class="text-base font-semibold text-white">Histórico de Movimentações</h2>
                <p class="text-xs text-slate-400">Auditoria completa de entradas, saídas e ajustes</p>
              </div>
              <span class="text-xs px-3 py-1 rounded-full bg-white/10 text-slate-300">${filteredMovs.length} registros</span>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse min-w-[640px]">

                  <tr class="border-b border-white/10 text-[11px] uppercase text-slate-400">
                    <th class="py-3 px-2.5">Data / Hora</th>
                    <th class="py-3 px-2.5">Operação</th>
                    <th class="py-3 px-2.5">Produto (SKU)</th>

                    <th class="py-3 px-2.5 text-right">Qtd.</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-white/5 text-xs">
                  ${filteredMovs.map(m => {
                    const isEntry = m.type === 'Entrada';
                    const isAdj = m.type === 'Ajuste';
                    const badge = isEntry
                      ? 'bg-emerald-500/20 text-emerald-300'
                      : isAdj
                        ? 'bg-amber-500/20 text-amber-300'
                        : 'bg-blue-500/20 text-blue-300';
                    return `
                      <tr class="hover:bg-white/[0.04] transition">
                        <td class="py-3 px-2.5 text-slate-400 whitespace-nowrap">${m.date}</td>

    // -------------------------------------------------------------------------
    // 4. CONTROLE DE LOTES E VALIDADES (FIFO)
    // -------------------------------------------------------------------------
    function renderBatchesTab() {
      // Ordenação FIFO automática (data de validade mais próxima primeiro)
      const sortedBatches = [...state.batches]
        .filter(b => {
          const matchW = state.selectedWarehouse === 'Todos' || b.warehouse === state.selectedWarehouse;
          const q = state.searchQuery.trim().toLowerCase();
          const matchQ = !q || b.batchNumber.toLowerCase().includes(q) || b.skuName.toLowerCase().includes(q) || b.skuCode.toLowerCase().includes(q);
          return matchW && matchQ;
        })
        .sort((a, b) => new Date(a.expDate) - new Date(b.expDate));

      const expiredCount = sortedBatches.filter(b => getDaysToExpiry(b.expDate) < 0).length;
      const nearExpiryCount = sortedBatches.filter(b => {
        const d = getDaysToExpiry(b.expDate);
        return d >= 0 && d <= 30;
      }).length;

      return `
        <div class="flex flex-col gap-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-400">Lotes Ativos (FIFO)</span>
                <p class="text-2xl font-bold text-white mt-1">${sortedBatches.length}</p>
              </div>
              <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-[#64B5F6] flex items-center justify-center">
                <i class="ph ph-stack-simple text-xl"></i>
              </div>
            </div>

            <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-400">Próximos ao Vencimento (≤ 30d)</span>
                <p class="text-2xl font-bold text-amber-400 mt-1">${nearExpiryCount}</p>
              </div>
              <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-300 flex items-center justify-center">
                <i class="ph ph-hourglass-high text-xl"></i>
              </div>
            </div>

            <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-400">Lotes Vencidos (Bloqueio)</span>
                <p class="text-2xl font-bold text-rose-400 mt-1">${expiredCount}</p>
              </div>
              <div class="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-300 flex items-center justify-center">
                <i class="ph ph-prohibit text-xl"></i>
              </div>
            </div>
          </div>

          <div class="glass-card rounded-[24px] p-5">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>
                <h2 class="text-base font-semibold text-white">Fila de Expedição FIFO (First-In, First-Out)</h2>
                <p class="text-xs text-slate-400">Ordenado automaticamente pela data de validade mais próxima</p>
              </div>
              <button onclick="openBatchModal()" class="bg-[#2196F3] hover:bg-[#1E88E5] text-white text-xs font-semibold px-4 py-2 rounded-full flex items-center gap-1.5 transition">
                <i class="ph-bold ph-plus"></i>
                <span>Novo Lote</span>
              </button>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse min-w-[720px]">
                <thead>
                  <tr class="border-b border-white/10 text-[11px] uppercase text-slate-400">
                    <th class="py-3 px-3">Prioridade FIFO</th>
                    <th class="py-3 px-3">Nº Lote</th>
                    <th class="py-3 px-3">Produto (SKU)</th>
                    <th class="py-3 px-3">Fabricação</th>
                    <th class="py-3 px-3">Validade</th>
                    <th class="py-3 px-3 text-center">Saldo Lote</th>
                    <th class="py-3 px-3 text-right">Status Validade</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-white/5 text-xs">
                  ${sortedBatches.map((b, idx) => {
                    const days = getDaysToExpiry(b.expDate);
                    const status = getBatchStatus(days);
                    return `
                      <tr class="hover:bg-white/[0.04] transition">
                        <td class="py-3.5 px-3">
                          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/10 font-semibold text-white">
                            #${idx + 1} ${idx === 0 ? 'Expedir 1º' : ''}
                          </span>
                        </td>
                        <td class="py-3.5 px-3 font-mono font-semibold text-[#64B5F6]">${b.batchNumber}</td>
                        <td class="py-3.5 px-3">
                          <div class="font-semibold text-white">${b.skuName}</div>
                          <div class="text-[11px] text-slate-400">${b.skuCode} • ${b.warehouse}</div>
                        </td>
                        <td class="py-3.5 px-3 text-slate-300">${b.mfgDate.split('-').reverse().join('/')}</td>
                        <td class="py-3.5 px-3 font-medium text-white">${b.expDate.split('-').reverse().join('/')}</td>
                        <td class="py-3.5 px-3 text-center font-bold text-white">${b.quantity} un</td>
                        <td class="py-3.5 px-3 text-right">
                          <span class="px-2.5 py-1 rounded-full border font-semibold ${status.badge}">
                            ${status.label}
                          </span>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

      const alerts = getStockAlerts();
      const minAlerts = alerts.filter(a => a.type === 'min');
      const maxAlerts = alerts.filter(a => a.type === 'max');

      return `
        <div class="flex flex-col gap-5">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-card rounded-[22px] p-5 border-l-4 border-l-rose-500">

                <div>
                  <span class="text-xs font-semibold uppercase tracking-wider text-rose-400">Risco de Ruptura</span>
                  <h3 class="text-2xl font-bold text-white mt-1">${minAlerts.length} Produtos Abaixo do Mínimo</h3>
                  <p class="text-xs text-slate-400 mt-1">Ação recomendada: Gerar pedido de compra imediato</p>

                  <i class="ph-fill ph-warning text-2xl"></i>
                </div>

            </div>

            <div class="glass-card rounded-[22px] p-5 border-l-4 border-l-amber-400">
              <div class="flex items-center justify-between">
                <div>
                  <span class="text-xs font-semibold uppercase tracking-wider text-amber-300">Capital Parado</span>
                  <h3 class="text-2xl font-bold text-white mt-1">${maxAlerts.length} Produtos Acima do Máximo</h3>
                  <p class="text-xs text-slate-400 mt-1">Ação recomendada: Campanha promocional ou transferência</p>

                <div class="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-300 flex items-center justify-center">
                  <i class="ph-fill ph-trend-up text-2xl"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- Lista de Alertas com Ação Rápida -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${alerts.map(a => {
              const isMin = a.type === 'min';
              const pct = Math.min(100, Math.round((a.sku.stock / a.sku.maxStock) * 100));
              return `
                <div class="glass-card rounded-[24px] p-5 flex flex-col justify-between gap-4">
                  <div class="flex items-start justify-between gap-3">
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${isMin ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}">
                          ${a.severity}
                        </span>
                        <span class="text-xs font-mono text-slate-400">${a.sku.code}</span>
                      </div>
                      <h4 class="text-base font-bold text-white mt-2">${a.sku.name}</h4>
                      <p class="text-xs text-slate-400">${a.sku.supplier} • ${a.sku.warehouse}</p>
                    </div>
                    <div class="text-right">
                      <span class="text-2xl font-bold ${isMin ? 'text-rose-400' : 'text-amber-300'}">${a.sku.stock}</span>
                      <span class="text-xs text-slate-400 block">${a.sku.unit} em estoque</span>
                    </div>
                  </div>

                  <div>
                    <div class="flex justify-between text-[11px] text-slate-300 mb-1.5">
                      <span>Mínimo: <strong>${a.sku.minStock}</strong></span>
                      <span>Máximo: <strong>${a.sku.maxStock}</strong></span>
                    </div>
                    <div class="w-full h-2 rounded-full bg-white/10 overflow-hidden">
                      <div style="width: ${pct}%" class="h-full rounded-full ${isMin ? 'bg-rose-500' : 'bg-amber-400'}"></div>
                    </div>
                  </div>

                  <div class="flex items-center justify-between pt-3 border-t border-white/10">
                    <span class="text-xs text-slate-300">
                      ${isMin
                        ? `Sugestão de compra: <strong class="text-white">+${a.suggestedOrder} ${a.sku.unit}</strong>`
                        : `Excesso imobilizado: <strong class="text-amber-300">${formatCurrency(a.excessCapital)}</strong>`}
                    </span>

                    ${isMin ? `
                      <button onclick="generateReplenishmentOrder('${a.sku.code}', ${a.suggestedOrder})"
                        class="bg-[#2196F3] hover:bg-[#1E88E5] text-white text-xs font-semibold px-3.5 py-2 rounded-full shadow-md shadow-blue-500/20 transition flex items-center gap-1.5 cursor-pointer">
                        <i class="ph-bold ph-shopping-cart-simple"></i>
                        <span>Gerar Pedido (+${a.suggestedOrder})</span>
                      </button>
                    ` : `
                      <button onclick="quickMovementForSku('${a.sku.code}')"

    // -------------------------------------------------------------------------
    // 6. RELATÓRIOS E INDICADORES (KPIs & CURVA ABC)
    // -------------------------------------------------------------------------
    function renderReportsTab() {
      const skus = getFilteredSkus();
      const totalImmobilized = skus.reduce((acc, s) => acc + s.stock * s.costPrice, 0);
      const totalPotentialRevenue = skus.reduce((acc, s) => acc + s.stock * s.salePrice, 0);
      const minAlertsCount = skus.filter(s => s.stock < s.minStock).length;
      const ruptureRate = skus.length ? ((minAlertsCount / skus.length) * 100).toFixed(1) : '0.0';

      // Cálculo da Curva ABC baseado no valor financeiro em estoque (stock * costPrice)
      const ranked = [...skus]
        .map(s => ({ ...s, totalValue: s.stock * s.costPrice }))
        .sort((a, b) => b.totalValue - a.totalValue);

      let cumulative = 0;
      const abcItems = ranked.map(item => {
        cumulative += item.totalValue;
        const cumPct = totalImmobilized ? (cumulative / totalImmobilized) * 100 : 0;
        let cls = 'C';
        if (cumPct <= 75) cls = 'A';
        else if (cumPct <= 92) cls = 'B';
        return { ...item, cumPct: cumPct.toFixed(1), abcClass: cls };
      });

      return `
        <div class="flex flex-col gap-5">
          <!-- KPIs Principais -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="glass-card rounded-[22px] p-5">
              <div class="flex items-center justify-between text-slate-400 text-xs">
                <span>Capital Imobilizado</span>
                <i class="ph ph-vault text-lg text-[#64B5F6]"></i>
              </div>
              <div class="text-2xl font-bold text-white mt-2">${formatCurrency(totalImmobilized)}</div>
              <div class="text-[11px] text-slate-400 mt-1">Custo total em prateleira</div>
            </div>

            <div class="glass-card rounded-[22px] p-5">
              <div class="flex items-center justify-between text-slate-400 text-xs">
                <span>Giro de Estoque Médio</span>
                <i class="ph ph-arrows-clockwise text-lg text-emerald-400"></i>
              </div>
              <div class="text-2xl font-bold text-white mt-2">4.8x <span class="text-xs font-normal text-slate-400">/ mês</span></div>
              <div class="text-[11px] text-emerald-400 mt-1">Cobertura média: 18 dias</div>
            </div>

            <div class="glass-card rounded-[22px] p-5">
              <div class="flex items-center justify-between text-slate-400 text-xs">
                <span>Taxa de Ruptura</span>
                <i class="ph ph-warning-octagon text-lg text-rose-400"></i>
              </div>
              <div class="text-2xl font-bold text-white mt-2">${ruptureRate}%</div>
              <div class="text-[11px] text-slate-400 mt-1">${minAlertsCount} de ${skus.length} SKUs em alerta</div>
            </div>

            <div class="glass-card rounded-[22px] p-5">
              <div class="flex items-center justify-between text-slate-400 text-xs">
                <span>Margem Bruta Projetada</span>
                <i class="ph ph-chart-pie-slice text-lg text-sky-400"></i>
              </div>
              <div class="text-2xl font-bold text-emerald-400 mt-2">
                ${totalPotentialRevenue ? (((totalPotentialRevenue - totalImmobilized) / totalPotentialRevenue) * 100).toFixed(1) : 0}%
              </div>
              <div class="text-[11px] text-slate-400 mt-1">Receita est.: ${formatCurrency(totalPotentialRevenue)}</div>
            </div>
          </div>

          <!-- Classificação Curva ABC -->
          <div class="glass-card rounded-[24px] p-5 sm:p-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
              <div>
                <h2 class="text-base sm:text-lg font-semibold text-white">Análise de Curva ABC (Pareto Financeiro)</h2>
                <p class="text-xs text-slate-400">Classe A (até 75% do valor), Classe B (75% a 92%) e Classe C (restante)</p>
              </div>
              <button onclick="exportReportCSV()" class="bg-white/10 hover:bg-white/20 border border-white/15 text-white text-xs font-semibold px-4 py-2 rounded-full flex items-center gap-1.5 transition cursor-pointer">
                <i class="ph ph-download-simple text-sm"></i>
                <span>Exportar CSV</span>
              </button>
            </div>

            <div class="flex flex-col gap-3.5">
              ${abcItems.map(item => {
                const share = totalImmobilized ? ((item.totalValue / totalImmobilized) * 100).toFixed(1) : 0;
                const classColors = {
                  A: 'bg-[#2196F3] text-white',
                  B: 'bg-sky-400/25 text-sky-200 border border-sky-400/40',
                  C: 'bg-white/10 text-slate-300'
                };
                return `
                  <div class="p-3.5 rounded-2xl bg-white/[0.04] border border-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                      <span class="w-8 h-8 rounded-xl font-bold text-xs flex items-center justify-center shrink-0 ${classColors[item.abcClass]}">
                        ${item.abcClass}
                      </span>
                      <div class="min-w-0">
                        <div class="text-xs sm:text-sm font-semibold text-white truncate">${item.name}</div>
                        <div class="text-[11px] text-slate-400">${item.code} • ${item.stock} ${item.unit} × ${formatCurrency(item.costPrice)}</div>
                      </div>
                    </div>

                    <div class="flex items-center gap-4 sm:w-1/2">
                      <div class="flex-1">
                        <div class="flex justify-between text-[11px] mb-1">
                          <span class="text-slate-300">Representatividade: ${share}%</span>
                          <span class="text-slate-400">Acum.: ${item.cumPct}%</span>
                        </div>
                        <div class="w-full h-2 rounded-full bg-white/10 overflow-hidden">
                          <div style="width: ${Math.max(6, share)}%" class="h-full rounded-full ${item.abcClass === 'A' ? 'bg-[#2196F3]' : item.abcClass === 'B' ? 'bg-sky-300' : 'bg-slate-400'}"></div>
                        </div>
                      </div>
                      <div class="text-right font-bold text-xs sm:text-sm text-white shrink-0 w-28">
                        ${formatCurrency(item.totalValue)}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Submissão de Movimentação (Modal ou Inline)
    function processMovement(type, skuCode, qty, reason) {
      const sku = state.skus.find(s => s.code === skuCode);
      if (!sku) return;

      if ((type === 'Saída' || type === 'Ajuste') && sku.stock < qty) {
        showToast(`Saldo insuficiente para ${sku.code}! Disponível: ${sku.stock} ${sku.unit}.`, 'warning');
        return false;
      }

      if (type === 'Entrada') {
        sku.stock += qty;
      } else {
        sku.stock -= qty;
      }

      state.movements.unshift({
        id: 'MOV-' + Math.floor(1000 + Math.random() * 9000),
        date: '12/11/2026 10:05',
        type,
        reason,
        skuCode: sku.code,
        skuName: sku.name,
        quantity: qty,
        operator: 'Rafael Mendes',
        warehouse: sku.warehouse
      });

      showToast(`${type} de ${qty} ${sku.unit} em ${sku.code} registrada! Novo saldo: ${sku.stock}.`, 'success');
      renderCurrentTab();
      return true;
    }

    function handleModalMovementSubmit(e) {
      e.preventDefault();
      const type = document.getElementById('modal-mov-type').value;
      const skuCode = document.getElementById('modal-mov-sku').value;
      const qty = parseInt(document.getElementById('modal-mov-qty').value, 10);
      const reason = document.getElementById('modal-mov-reason').value;
      if (processMovement(type, skuCode, qty, reason)) {
        closeModal();
      }
    }

    function submitInlineMovement(e) {
      e.preventDefault();
      const type = document.getElementById('inline-mov-type').value;
      const skuCode = document.getElementById('inline-mov-sku').value;
      const qty = parseInt(document.getElementById('inline-mov-qty').value, 10);
      const reason = document.getElementById('inline-mov-reason').value;
      processMovement(type, skuCode, qty, reason);
    }

    function handleModalSkuSubmit(e) {
      e.preventDefault();
      const payload = {
        code: document.getElementById('sku-code').value.trim().toUpperCase(),
        name: document.getElementById('sku-name').value.trim(),
        category: document.getElementById('sku-cat').value,
        unit: document.getElementById('sku-unit').value,
        warehouse: document.getElementById('sku-warehouse').value,
        supplier: document.getElementById('sku-supplier').value.trim(),
        costPrice: parseFloat(document.getElementById('sku-cost').value),
        salePrice: parseFloat(document.getElementById('sku-sale').value),
        stock: parseInt(document.getElementById('sku-stock').value, 10),
        minStock: parseInt(document.getElementById('sku-min').value, 10),
        maxStock: parseInt(document.getElementById('sku-max').value, 10),
        batchControlled: document.getElementById('sku-batch').checked,
        monthlySales: 20
      };

      if (state.editingSkuId) {
        const idx = state.skus.findIndex(s => s.id === state.editingSkuId);
        if (idx !== -1) {
          state.skus[idx] = { ...state.skus[idx], ...payload };
          showToast(`SKU ${payload.code} atualizado com sucesso!`, 'success');
        }
      } else {
        state.skus.unshift({
          id: 'SKU-' + Math.floor(1000 + Math.random() * 9000),
          ...payload
        });
        showToast(`Novo SKU ${payload.code} cadastrado no catálogo!`, 'success');
      }

      closeModal();
      renderCurrentTab();
    }

    function handleModalBatchSubmit(e) {
      e.preventDefault();
      const skuCode = document.getElementById('batch-sku').value;
      const sku = state.skus.find(s => s.code === skuCode);
      const qty = parseInt(document.getElementById('batch-qty').value, 10);
      const batchNumber = document.getElementById('batch-number').value.trim().toUpperCase();
      const mfgDate = document.getElementById('batch-mfg').value;
      const expDate = document.getElementById('batch-exp').value;

      if (!sku) return;
      sku.batchControlled = true;
      sku.stock += qty;

      state.batches.push({
        id: 'LOT-' + Math.floor(100 + Math.random() * 900),
        batchNumber,
        skuCode: sku.code,
        skuName: sku.name,
        mfgDate,
        expDate,
        quantity: qty,
        warehouse: sku.warehouse
      });

      state.movements.unshift({
        id: 'MOV-' + Math.floor(1000 + Math.random() * 9000),
        date: '12/11/2026 10:12',
        type: 'Entrada',
        reason: `Entrada Lote ${batchNumber}`,
        skuCode: sku.code,
        skuName: sku.name,
        quantity: qty,
        operator: 'Rafael Mendes',
        warehouse: sku.warehouse
      });

      showToast(`Lote ${batchNumber} registrado (+${qty} ${sku.unit})!`, 'success');
      closeModal();
      renderCurrentTab();
    }

    function generateReplenishmentOrder(skuCode, qty) {
      processMovement('Entrada', skuCode, qty, 'Pedido de Reposição Automático');
    }

    function toggleChartPeriod() {
      state.chartPeriod = state.chartPeriod === '12-18 Nov' ? '05-11 Nov' : '12-18 Nov';
      renderCurrentTab();
    }

    function exportReportCSV() {
      const headers = ['SKU', 'Produto', 'Categoria', 'Saldo', 'Minimo', 'Maximo', 'CustoUnitario', 'ValorImobilizado'];
      const rows = state.skus.map(s => [
        s.code,
        `"${s.name}"`,
        `"${s.category}"`,
        s.stock,
        s.minStock,
        s.maxStock,
        s.costPrice.toFixed(2),
        (s.stock * s.costPrice).toFixed(2)
      ]);
      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', 'relatorio_estoque_kpi.csv');
      document.body.appendChild(link);
      link.click();
      link.remove();
      showToast('Relatório CSV exportado com sucesso!', 'success');
    }

    // Fecha popover de notificações ao clicar fora
    document.addEventListener('click', (e) => {
      const pop = document.getElementById('notifications-popover');
      if (pop && !pop.classList.contains('hidden')) {
        if (!e.target.closest('#notifications-popover') && !e.target.closest('button[title="Notificações do Estoque"]')) {
          pop.classList.add('hidden');
        }
      }
    });

    // Inicialização
    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentTab();
    });
  </script>
</body>
</html>
